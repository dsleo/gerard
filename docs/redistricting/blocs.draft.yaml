# blocs.draft.yaml — party/nuance → bloc mappings for the audit (03 §5).
#
# Nuance codes: VERIFIED against Annexe 1 of the Ministry of the Interior instruction
# of 11 June 2024, NOR IOMA2415630C (24 nuances, legislative elections 2024).
# Source copy: docs/redistricting/ (text extracted from the instruction PDF).
#
# Status: a proposal, not a validated mapping.
#   - Bloc assignment is a political judgment. Both mappings below must be published,
#     reviewed by the team, and both reported. Do not choose one to get a result.
#   - The ministry assigns nuances per candidate, not per party. The nuance is the
#     unit here; party names are never used in the audit.
#   - Codes applying only to the 2024 legislative election. Check any other election's grid.
#
# Nuances in the 2024 grid (24):
#   Party nuances (12): COM FI SOC RDG VEC REN MDM HOR UDI LR RN REC
#   Sensitivity nuances (7): EXG DVG ECO REG DVC DVD EXD
#   Alliance / special (5): UG ENS UXD DSV DIV
#
# Each mapping must assign every nuance to exactly one bloc, or to "other".

source: "Instruction NOR IOMA2415630C, Annexe 1 (grille des nuances, législatives 2024)"

mappings:
  coarse:
    description: "Four blocs. Fewest judgment calls; use as the headline."
    blocs:
      left:       [EXG, COM, FI, SOC, RDG, VEC, UG, DVG, ECO]
      centre:     [REN, MDM, HOR, ENS, DVC, UDI]
      right:      [LR, DVD, DSV]
      far_right:  [RN, REC, UXD, EXD]
      other:      [REG, DIV]

  fine:
    description: "Six blocs. Splits the left (far-left vs. socialist/left vs. ecologists) and the right (LR vs. far-right). More sensitive to nuance choices."
    blocs:
      far_left:   [EXG, COM, FI]
      left:       [SOC, RDG, UG, DVG]
      ecologist:  [VEC, ECO]
      centre:     [REN, MDM, HOR, ENS, DVC, UDI]
      right:      [LR, DVD, DSV]
      far_right:  [RN, REC, UXD, EXD]
      other:      [REG, DIV]

notes:
  - "UDI is placed in the centre in both mappings. It is centre-right; placing it in right is a defensible alternative and should be tested."
  - "DSV (souverainiste right) is placed in right, not far_right. This is a judgment; test the alternative."
  - "UG (Union de la gauche) carries the New Popular Front candidates. Its bloc is the left in both mappings."
  - "REG (regionalists) and DIV (inclassable) are kept out of the blocs as other. They are not partisan blocs."

rules:
  - "Blocs are assigned at nuance level, never by reading party names from results files."
  - "Each nuance belongs to exactly one bloc per mapping."
  - "Changing a mapping creates a new audit run; old results are never overwritten."
