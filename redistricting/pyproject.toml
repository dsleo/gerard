[project]
name = "redistrict"
version = "0.1.0"
description = "Auditable, vote-blind redistricting engine for French legislative constituencies"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "geopandas>=1", "shapely>=2.1"]

[project.scripts]
redistrict = "redistrict.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
